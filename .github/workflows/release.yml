name: Release

# Tag format: <crate>-v<semver>, e.g. netprobe-v0.1.0
on:
  push:
    tags: ['*-v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      crate: ${{ steps.parse.outputs.crate }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          crate="${tag%-v*}"; version="${tag##*-v}"
          test -f "crates/$crate/Cargo.toml" || { echo "unknown crate '$crate'"; exit 1; }
          manifest=$(grep -m1 '^version' "crates/$crate/Cargo.toml" | cut -d'"' -f2)
          [ "$manifest" = "$version" ] || { echo "tag $version != Cargo.toml $manifest"; exit 1; }
          echo "crate=$crate" >> "$GITHUB_OUTPUT"; echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test (native targets only)
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test -p ${{ needs.meta.outputs.crate }} --locked
      - name: Build
        run: cargo build -p ${{ needs.meta.outputs.crate }} --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="${{ needs.meta.outputs.crate }}"
          dir="$name-${{ needs.meta.outputs.version }}-${{ matrix.target }}"
          mkdir "$dir"
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/$name$ext" "$dir/"
          cp LICENSE-MIT LICENSE-APACHE "crates/$name/README.md" "$dir/"
          if [[ "$ext" == ".exe" ]]; then
            7z a -tzip "$dir.zip" "$dir" >/dev/null; archive="$dir.zip"
          else
            tar -czf "$dir.tar.gz" "$dir"; archive="$dir.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && cat *.sha256 > SHA256SUMS && cd ..
          notes=$(awk '/^## \[/{n++} n==1' "crates/${{ needs.meta.outputs.crate }}/CHANGELOG.md")
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "${{ needs.meta.outputs.crate }} ${{ needs.meta.outputs.version }}" \
            --notes "$notes"
