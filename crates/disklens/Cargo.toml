[package]
name = "disklens"
version = "0.1.0"
description = "Fast parallel disk usage analysis: largest directories and files, du-compatible sizes, JSON output"
readme = "README.md"
keywords = ["disk", "du", "usage", "filesystem", "storage"]
categories = ["command-line-utilities", "filesystem"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-common = { version = "0.1.0", path = "../sys-common" }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.12.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
