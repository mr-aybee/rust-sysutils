[package]
name = "filewatch"
version = "0.1.0"
description = "Watch files and directories; print debounced changes or run a command safely on change"
readme = "README.md"
keywords = ["watch", "inotify", "filesystem", "events", "fsevents"]
categories = ["command-line-utilities", "filesystem", "development-tools"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-common = { version = "0.1.0", path = "../sys-common" }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
